BASE: base.yaml

data:
  train_h5: data/PHM_spur/PHM_spur8_T1_300-1/train.h5
  test_h5: data/PHM_spur/PHM_spur8_T1_300-1/test.h5
  dataset_name: phm
  num_classes: 8

method:
  name: sdagn

model:
  freq_backbone_name: resnet1d18
  freq_in_channels: 1
  freq_pretrained: false
  classifier_dropout: 0.1
  backbone_kwargs:
    base_channels: 64
    norm: bn
    act: elu

  # SDAGN core-idea reproduction
  sdagn_mixup_alpha: 0.4
  sdagn_mixup_mode: beta
  sdagn_cls_weight: 1.0
  sdagn_aug_cls_weight: 1.0
  sdagn_semantic_weight: 1.0
  sdagn_triplet_weight: 0.1
  sdagn_triplet_margin: 1.0
  sdagn_mmd_gamma: 1.0
  sdagn_mmd_num_kernels: 1
  sdagn_normalize_triplet_feat: true
  sdagn_max_aug_per_class: 64
  sdagn_balance_to_max: true
  sdagn_min_samples_per_class_to_mix: 2


output:
  root: outputs
  exp_name: darm_phm_T1_300-1
BASE: base.yaml

data:
  train_h5: data/PHM_spur/PHM_spur8_T5_300-5/train.h5
  test_h5: data/PHM_spur/PHM_spur8_T5_300-5/test.h5
  dataset_name: phm          # phm / pu

method:
  name: mcpdg

model:
  feature_mode: freq
  freq_backbone_name: resnet1d18
  freq_in_channels: 1
  freq_pretrained: false

  # =========================
  # backbone 通用附加参数
  # =========================
  classifier_dropout: 0.0
  backbone_kwargs:
    norm: bn
    act: elu

  # =========================
  # 模型功能开关
  # use_linear_head: 普通线性分类头，提供稳定判别基线，需要与proto同时开启
  # use_dynamic_proto: 启用工况条件动态原型
  # use_proto_cls: 启用原型分类分支
  # use_align_loss: 启用原型对齐损失
  # use_pcl_loss: 启用原型对比学习损失
  # use_meta_loss: 启用 MLDG 风格 meta-train/meta-test 损失
  # =========================
  use_linear_head: true
  use_dynamic_proto: true
  use_proto_cls: true
  use_align_loss: true
  use_pcl_loss: true
  use_meta_loss: true

  # 新增
  use_disentangled_proto: true
  use_minority_calib_loss: true

  # =========================
  # 工况条件与动态原型结构参数
  # cond_dim: 工况向量维度
  #   PHM 用 [speed, 0, 0]
  #   PU  用 [speed, torque, force]
  # cond_hidden_dim: 工况编码器隐藏层维度
  # proto_hidden_dim: 动态原型生成器隐藏层维度
  # =========================
  cond_dim: 3
  cond_hidden_dim: 64
  proto_hidden_dim: 256

  # =========================
  # 各损失项权重
  # align_weight: 原型对齐损失权重，建议保留
  # pcl_weight: 原型对比损失权重，当前 0.2 偏大，建议优先试 0.05 或 0.1
  # meta_test_weight: meta-test 分支损失权重
  # pcl_temperature: 对比学习温度参数
  # imbalance_power: 类别不平衡加权强度
  # =========================
  align_weight: 1.0
  pcl_weight: 0.2
  meta_test_weight: 0.5
  pcl_temperature: 0.1
  imbalance_power: 0.5

  # =========================
  # 原型生成与分类融合参数
  # proto_residual_alpha: 工况对原型的残差调制强度
  # proto_cls_weight: 原型分类损失在总损失中的权重
  # eval_proto_weight: 推理时原型 logits 融合强度
  # =========================
  proto_residual_alpha: 1
  proto_cls_weight: 0.5
  eval_proto_weight: 0.5

  # 新增
  minority_calib_weight: 0.2

  meta_debug: false
  meta_debug_max_steps: 20

output:
  root: outputs
  exp_name: mcpdg_phm_T5_300-5

BASE: base.yaml

data:
  train_h5: data/PHM_spur/PHM_spur8_T5_300-5/train.h5
  test_h5: data/PHM_spur/PHM_spur8_T5_300-5/test.h5
  dataset_name: phm          # phm / pu
  num_classes: 8
  num_workers: 0
  pin_memory: true
  drop_last_train: false

method:
  name: mcpdg

model:
  feature_mode: freq         # freq / tf / both
  freq_backbone_name: resnet1d18
  freq_in_channels: 1
  freq_pretrained: false
  tf_backbone_name: resnet18
  tf_in_channels: 1
  tf_pretrained: false
  classifier_dropout: 0.0
  backbone_kwargs:
    norm: bn
    act: elu


  # =========================
  # MCPDG 方法参数
  # =========================
  cond_dim: 3
  cond_hidden_dim: 64
  proto_hidden_dim: 256

  # 动态原型 / 对比学习 / 元学习损失权重
  align_weight: 1.0
  pcl_weight: 0.2
  pcl_temperature: 0.1
  meta_test_weight: 1.0

  # 源域内 meta split 参数
  meta_test_domains: 1
  meta_randomize: true
  meta_split_seed: 42

output:
  root: outputs
  exp_name: mcpdg_phm_T5_300-5
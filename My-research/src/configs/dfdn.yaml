BASE: base.yaml

data:
  train_h5: data/PHM_spur/PHM_spur8_T1_300-1/train.h5
  test_h5: data/PHM_spur/PHM_spur8_T1_300-1/test.h5
  dataset_name: phm
  num_classes: 8


method:
  name: dfdn

model:
  freq_backbone_name: resnet1d18
  freq_in_channels: 1
  freq_pretrained: false
  classifier_dropout: 0.1
  backbone_kwargs:
    base_channels: 64
    norm: bn
    act: elu

  decouple_hidden_dim: 512
  fault_feat_dim: 256
  domain_feat_dim: 256
  integrator_hidden_dim: 256
  domain_disc_hidden_dim: 256
  disc_dropout: 0.1

  lambda_fault_cls: 1.0
  lambda_aux_cls: 0.5
  lambda_domain_cls: 1.0
  lambda_adv_domain: 0.1
  lambda_orth: 0.05
  lambda_fused_align: 0.0

  grl_lambda: 1.0
  use_grl_schedule: true
  grl_warmup_steps: 1000

output:
  root: outputs
  exp_name: darm_phm_T1_300-1
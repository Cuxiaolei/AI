# 数据配置
data:
  root_dir: "/root/data/Ottawa_Bearing_Dataset"
  sampling_rate: 200000  # 采样频率 200kHz
  window_size: 2048      # 样本窗口大小
  overlap: 0.5           # 重叠率
  channels: ['Channel_1'] # 使用振动通道

  # 小样本配置
  n_way: 3              # ✨ 类别数（健康、内圈缺陷、外圈缺陷）
  k_shot: 5             # ✨ 每个类别的支持样本数
  n_query: 15           # ✨ 每个类别的查询样本数

  # DA域泛化配置
  source_domains: ['H-A', 'H-B', 'I-A', 'I-B', 'O-A', 'O-B']  # 源域
  target_domains: ['H-C', 'H-D', 'I-C', 'I-D', 'O-C', 'O-D']  # 目标域

# 模型配置
model:
  backbone: "resnet18_1d"  # 1D ResNet
  num_classes: 3          # 类别数（与n_way保持一致）
  feature_dim: 512        # 特征维度
  freeze_bn: false        # 是否冻结BN层

# 训练配置
training:
  epochs: 100
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  scheduler: "step"       # 学习率调度
  step_size: 30
  gamma: 0.1

  # 原型对比学习配置
  proto_loss_weight: 1.0  # 原型损失权重
  temperature: 0.1        # 温度参数

  # 持续学习配置
  memory_size: 500        # 记忆回放缓冲区大小
  rehearsal_ratio: 0.3    # 回放比例
  episodes_per_epoch: 50  # 每轮训练的episode数量

# 评估配置
evaluation:
  metrics: ['accuracy', 'f1_score', 'confusion_matrix']
  eval_freq: 10          # 每N轮评估一次
  save_model: true
  save_freq: 20

# 硬件配置
device: "cuda"            # cuda, cpu
num_workers: 4
seed: 42
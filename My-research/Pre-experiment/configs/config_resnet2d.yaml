# 渥太华轴承数据集2D-ResNet配置 - 小样本域泛化版
DATA:
  path: '/root/data/Ottawa_Bearing_Dataset'  # 使用相对路径
  window_size: 2048
  overlap: 0.75  # 增大重叠以扩充样本量
  target_size: 128  # 增大时频图尺寸保留更多信息

MODEL:
  cnn_type: 'resnet2d'
  feature_dim: 128
  pretrained: true
  target_size: 128

FEW_SHOT:
  k_shot: 10              # 支持集样本数
  n_query: 25             # 查询集样本数
  n_episodes: 50          # 训练episode数

CONTINUAL:
  method: 'replay'        # 持续学习方法: replay/ewc
  memory_per_domain: 50   # 每个域存储的样本数
  lambda_ewc: 0.4         # EWC正则化权重

TRAIN:
  learning_rate: 0.001    # 预训练模型用小学习率
  weight_decay: 0.0001
  lambda_coral: 0.3       # 域对齐损失权重
  lambda_proto: 0.5       # 原型对比损失权重
  temperature: 0.07       # 原型对比温度系数

OUTPUT:
  model_path: './results/resnet2d_model.pt'
  log_dir: './logs_resnet2d'
  result_dir: './results'
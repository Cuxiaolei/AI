BASE: ../cwru_config.yaml

split:
  # 4 个工况域
  # 任务2：0，1，3 -> 2
  source_conditions:
    - "0HP"
    - "1HP"
    - "3HP"
  target_condition: "2HP"

sampling:
  # 源域（训练集）抽样数
  source:
    normal_per_domain: 300
    fault_per_class_per_domain: 5

output:
  output_dir: "data/CWRU_12k_DE"
  task_name: "CWRU_T2_300-5"
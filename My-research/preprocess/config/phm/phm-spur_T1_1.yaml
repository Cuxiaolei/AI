BASE: ../phm-spur_config.yaml

# 任务1：0，1，2 -> 3 -> 3
split:
  # 源域工况
  source_conditions:
    - "30hz_High"
    - "35hz_High"
    - "40hz_High"
  # 目标域工况
  target_condition: "45hz_High"

sampling:
  source:
    normal_per_domain: 300
    fault_per_class_per_domain: 1


output:
  task_name: "phm-spur_T1_1"
# configs/test/dsfsfd_test.yaml

# 训练输出目录（必须包含 meta/config.json）
exp_dir: /root/outputs/pu_dsfsfd_lodo/run0

# 要测试的 checkpoint（相对 exp_dir 或绝对路径）
ckpt: checkpoints/last.pth
# ckpt: checkpoints/40.pth

# 测试域：支持单个，也支持列表（推荐列表，一次把多个域跑完）
test_domains:
  - N15_M01_F10
  - N15_M07_F04
  - N15_M07_F10
  - N09_M07_F10

# 用哪个域来构 scaler（标准化）。默认会用训练时 config.json 里的 data.train_domain
# 你可以手动指定：
# train_domain_for_scaler: N09_M07_F10

# 测试 episode 数（默认用训练 config.json 的 test.iters）
iters: 2000

# 可选：覆盖 few-shot 设定（默认沿用训练 config.json 的 task.k_val/n_val/q_val）
# task_override:
#   k_val: 5
#   n_val: 5
#   q_val: 15

# 可选：覆盖 device/seed（默认沿用训练 config.json）
# device: cuda
# seed: 2025

# 可选：测试结果输出到哪里（默认写回 exp_dir）
# output_dir: outputs/test_only

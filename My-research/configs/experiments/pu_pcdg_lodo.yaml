experiment:
  mode: pcdg
  repeats: 1

data:
  # 这里指向你预处理后目录：data/pu/pu_DSFSFD/
  root: data/pu/pu_DSFSFD

  # 4 个工况域
  domains:
    - N15_M07_F10
    - N09_M07_F10
    - N15_M01_F10
    - N15_M07_F04

  # 你预处理时选的 10 类（顺序=全局 class_id）
  # 建议直接把 meta/selected_classes.json 里的列表粘贴过来，保持一致
  class_names:
    - K001
    - KA01
    - KA03
    - KA04
    - KI01
    - KI04
    - KI14
    - KB23
    - KB24
    - KB27

  normalize:
    enable: true
    mode: concat_zscore   # 模仿 DSFSFD：time+fft 拼一起做 zscore

  tf:
    size: 224

episode:
  k: 5
  n: 5
  q: 15
  episodes_per_epoch: 100
  eval_episodes: 200

output:
  exp_name: pu_pcdg_lodo

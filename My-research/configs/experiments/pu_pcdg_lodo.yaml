model:
  name: pcdg

experiment:
  mode: lodo      # ✅ 这里是实验模式，不是模型名
  repeats: 1

data:
  root: data/pu/pu_DSFSFD

  domains:
    - N15_M07_F10
    - N09_M07_F10
    - N15_M01_F10
    - N15_M07_F04

  class_names:
    - K001
    - KA01
    - KA03
    - KA04
    - KI01
    - KI04
    - KI14
    - KB23
    - KB24
    - KB27

  normalize:
    enable: true
    mode: concat_zscore

  tf:
    size: 224

episode:
  k: 5
  n: 5
  q: 15
  episodes_per_epoch: 100
  eval_episodes: 200

output:
  exp_name: pu_pcdg_lodo
